
name: Cacao Rating Lab 9 Failure Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  failure-handling-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run failure-handling unit tests
        run: python -m pytest tests/test_failure_handling.py -v

      - name: Run data corruption simulation
        run: python src/simulate_data_corruption.py

      - name: Upload failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cacao-lab9-failure-reports
          path: |
            artifacts/failure_simulation_report.json
            artifacts/corrupted_simulation_errors.csv
          if-no-files-found: warn
